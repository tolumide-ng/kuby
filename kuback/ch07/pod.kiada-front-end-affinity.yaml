apiVersion: v1
kind: Pod
metadata:
  name: kiada-front-end-affinity
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
        - matchExpressions:
          - key: node-role
            operator: In
            values:
            - front-end
          - key: skip-me
            operator: DoesNotExist
  containers:
    - name: kiada
      image: tolumide/kiada:0.1
      