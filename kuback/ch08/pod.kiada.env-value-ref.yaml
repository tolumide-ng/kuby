kind: Pod
metadata:
  name: kiada
spec:
  containers:
    - name: kiada
      image: luksa/kiada:0.4
      env:
        - name: POD_NAME
          value: kiada
        - name: INITIAL_STATUS_MESSAGE
          value: My name is $(POD_NAME). I run NodeJS version $(NODE_VERSION)


# kubectl set env pod <pod-name> --list