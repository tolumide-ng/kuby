apiVersion: v1
kind: Pod
metadata:
  name: kiada
spec:
  containers:
    - name: kiada
      image: luksa/kiada:0.4
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAMW
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: MAX_CPU_CORES
          valueFrom:
            resourceFieldRef:
              resource: limits.cpu
        - name: MAX_MEMORY_KB
          valueFrom:
            resourceFieldRef:
              resource: limits.memory
              divisor: 1K
      port:
        - name: http
          containerPort: 8080