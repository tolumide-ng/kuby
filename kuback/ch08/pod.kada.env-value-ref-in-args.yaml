kind: Pod
metadata:
  name: kiada
spec:
  containers:
    - name: kiada
      image: luksa/kiada:0.4
      args:
        -  --listen-port
        - $(LISTEN_PORT)
      env:
        - name: POD_NAME
          value: kiada
        - name: $(LISTEN_PORT)
          value: "8080"


# kubectl set env pod <pod-name> --list