apiVersion: v1
kind: Pod
metadata:
  name: kiada-ssl
spec:
  containers:
  - name: kiada
    image: tolumide/kiada:0.1
    env:
    - name: PORT
      value: "8081"
    ports:
    - name: http
      containerPort: 8081
  - name: envoy
    image: tolumide/kiada-ssl-proxy:0.1
    ports:
    - name: https
      containerPort: 8443
    - name: admin
      containerPort: 9901