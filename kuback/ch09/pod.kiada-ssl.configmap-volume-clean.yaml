apiVersion: v1
kind: Pod
metadata:
  name: kiada-ssl
spec:
  volumes:
    - name: envoy-config
      configMap:
        name: kiada-ssl-config
        items:
          - key: envoy.yaml
            path: envoy.yaml
  containers:
    - name: kiada
      image: luksa/kiada:0.4
      env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: NODE_IP
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
        - name: INITIAL_STATUS_MESSAGE
          valueFrom:
            configMapKeyRef:
              name: kiada-ssl-config
              key: status-message
              optional: true
      ports:
        - containerPort: 8080
          name: http
    - name: envoy
      image: luksa/kiada-ssl-proxy:0.1
      volumeMounts:
        - mountPath: /etc/envoy
          name: envoy-config
          readOnly: true
      ports:
        - name: http
          containerPort: 8443
        - name: admin
          containerPort: 9901