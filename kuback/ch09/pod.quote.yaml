apiVersion: v1
kind: Pod
metadata:
  name: quote
spec:
  volumes:
    - name: shared
      emptyDir: {}
  containers:
    - name: quote-writer
      image: luksa/quote-writer:0.1
      volumeMounts:
        - name: shared
          mountPath: /var/local/output
    - name: nginx
      image: nginx:alpine
      volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: shared
      ports:
        - name: http
          containerPort: 80
