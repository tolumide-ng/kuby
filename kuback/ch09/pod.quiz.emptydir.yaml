apiVersion: v1
kind: Pod
metadata:
  name: quiz
spec:
  volumes:
    - name: quiz-data
      emtyDir: {}
  containers:
    - name: quiz-api
      image: luksa/quiz-api:0.1
      ports:
        - containerPort: 8080
          name: http
    - name: mongo
      image: mongo
      volumeMounts:
        - name: quiz-data
          mountPath: /data/db